<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><title>Navigator integration tests</title>
  <style>
    body {
      font: 14px system-ui;
      margin: 0;
    }
    .notion-topbar {
      height: 44px;
      padding: 4px 20px;
      display: flex;
      justify-content: flex-end;
      background: #eee;
    }
    .notion-scroller {
      height: 550px;
      overflow: auto;
    }
    .notion-page-content {
      padding: 40px 70px;
    }
    .notion-selectable {
      margin: 20px 0;
    }
    h2,
    h3,
    h4 {
      margin: 0;
    }
  </style>
  <div class="notion-topbar">
    <div class="notion-topbar-action-buttons">
      <div style="display: flex">
        <div id="edited">編集</div>
        <div style="display: contents"><div role="button" aria-label="共有">共有</div></div>
      </div>
    </div>
  </div>
  <h1>合成DOM・統合テスト</h1>
  <pre id="results">実行中…</pre>
  <div class="notion-frame">
    <div class="notion-page-block" data-block-id="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa">
      <div contenteditable="true">テストページ</div>
    </div>
    <button id="native" role="button" aria-haspopup="dialog">2個のバックリンク</button>
    <div class="notion-floating-table-of-contents" id="native-toc">目次</div>
    <div class="notion-scroller vertical">
      <div class="notion-page-content">
        <div
          class="notion-selectable notion-header-block"
          data-block-id="11111111-1111-1111-1111-111111111111"
        >
          <h2 contenteditable="true">見出し1</h2>
        </div>
        <div
          class="notion-selectable notion-text-block"
          data-block-id="22222222-2222-2222-2222-222222222222"
        >
          <div contenteditable="true">
            <a href="https://app.notion.com/p/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb">本文リンク</a
            ><a href="https://app.notion.com/p/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb#same">重複</a>
          </div>
        </div>
        <div
          class="notion-selectable notion-code-block"
          data-block-id="55555555-5555-5555-5555-555555555555"
        >
          <div contenteditable="true" id="code-outer">
            <div contenteditable="true" id="code-inner">print(1)</div>
          </div>
        </div>
        <div
          class="notion-selectable notion-bulleted_list-block"
          data-block-id="66666666-6666-6666-6666-666666666666"
        >
          <div contenteditable="true" data-content-editable-leaf="true">親</div>
          <div style="padding-left: 26px">
            <div
              class="notion-selectable notion-text-block"
              data-block-id="77777777-7777-7777-7777-777777777777"
              id="nested"
            >
              <div contenteditable="true" data-content-editable-leaf="true">子</div>
            </div>
          </div>
        </div>
        <div
          class="notion-selectable notion-table-block"
          data-block-id="88888888-8888-8888-8888-888888888888"
        >
          <div style="position: relative; margin-left: 10px">
            <table>
              <tbody>
                <tr class="notion-table-row" id="row1">
                  <td>
                    <div contenteditable="true" data-content-editable-leaf="true" id="cell">a</div>
                  </td>
                </tr>
                <tr class="notion-table-row" id="row2">
                  <td><div contenteditable="true" data-content-editable-leaf="true">b</div></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div
          class="notion-selectable notion-column_list-block"
          data-block-id="cccccccc-0000-4000-8000-000000000001"
          style="display: flex; gap: 46px"
        >
          <div
            class="notion-selectable notion-column-block"
            data-block-id="cccccccc-0000-4000-8000-000000000002"
            style="width: 200px"
          >
            <div
              class="notion-selectable notion-text-block"
              data-block-id="cccccccc-0000-4000-8000-000000000003"
              id="col1"
            >
              <div contenteditable="true" data-content-editable-leaf="true">左</div>
            </div>
          </div>
          <div
            class="notion-selectable notion-column-block"
            data-block-id="cccccccc-0000-4000-8000-000000000004"
            style="width: 200px"
            id="column2"
          >
            <div
              class="notion-selectable notion-text-block"
              data-block-id="cccccccc-0000-4000-8000-000000000005"
              id="col2"
            >
              <div
                contenteditable="true"
                data-content-editable-leaf="true"
                style="padding-top: 3px"
              >
                右
              </div>
            </div>
          </div>
        </div>
        <div
          class="notion-selectable notion-sub_header-block"
          data-block-id="33333333-3333-3333-3333-333333333333"
        >
          <h3 contenteditable="true">見出し2</h3>
        </div>
        <div
          class="notion-selectable notion-sub_sub_header-block"
          data-block-id="44444444-4444-4444-4444-444444444444"
        >
          <div contenteditable="false" role="button">▸</div>
          <h4 contenteditable="true">見出し3</h4>
          <div>
            <div
              class="notion-selectable notion-text-block"
              data-block-id="abababab-abab-abab-abab-abababababab"
            >
              <div contenteditable="true" data-content-editable-leaf="true" id="toggle-child">
                トグルの中
              </div>
            </div>
          </div>
        </div>
        <div
          class="notion-selectable notion-header_4-block"
          data-block-id="99999999-9999-9999-9999-999999999999"
        >
          <h5 contenteditable="true" data-content-editable-leaf="true" id="h4">見出し4</h5>
        </div>
      </div>
    </div>
  </div>
  <script src="../extension/core.js"></script>
  <script src="integration-setup.js"></script>
  <!-- Notion's AI button at the bottom right (structure observed 2026-11-14). -->

    <div id="ai-corner" style="position: fixed; right: 24px; bottom: 24px">
      <div class="notion-ai-button" role="button" style="width: 40px; height: 40px"></div>
    </div>
  </div>
