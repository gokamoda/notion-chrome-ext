name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      - name: Check tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('extension/manifest.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag must be v${version} to match extension/manifest.json`);
          }
          JS

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package extension only
        working-directory: extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist
          zip -r "../dist/notion-page-navigator-${RELEASE_TAG}.zip" . \
            -x '*.DS_Store' '__MACOSX/*'
      - name: Create release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset="dist/notion-page-navigator-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
